<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>StudyCanvas</title>
</head>
<body>
<header class="top">
<button id="menu" class="icon">☰</button><div><b>StudyCanvas</b><small>Think • Connect • Learn</small></div>
<div class="topActions"><button id="searchBtn" class="icon">⌕</button><button id="themeBtn" class="icon">◐</button><button id="lockBtn" class="icon">🔒</button></div>
</header>

<section class="tools">
<button data-add="text">＋ Text</button><button data-add="heading">H Heading</button><button data-add="image">🖼 Image</button>
<button data-add="draw">✎ Draw</button><button data-add="math">∑ Math</button><button data-add="code">{"</>"}</button>
<button data-add="resource">🔗 Resource</button><button data-add="pdf">📄 PDF</button>
<button id="connect">↗ Connect</button><button id="study">🎯 Study</button>
</section>

<main id="viewport"><div id="board"><svg id="svg"></svg></div></main>

<aside id="drawer" class="drawer hidden">
<div class="drawerHead"><b>StudyCanvas</b><button id="close">×</button></div>
<button id="newBoard">＋ New board</button><div id="boardList"></div>
<hr><button id="backup">⬇ Export backup</button><button id="restore">⬆ Import backup</button><input id="import" type="file" accept=".json" hidden>
<hr><div class="stats" id="stats"></div><p class="tip">Your notebook is stored locally on this device. Export backups regularly.</p>
</aside>

<div id="searchBox" class="modal hidden"><div class="card"><div class="row"><input id="search" placeholder="Search notes, tags, concepts…"><button id="searchClose">×</button></div><div id="results"></div></div></div>
<div id="lock" class="modal hidden"><div class="card center"><div class="big">🔐</div><h2>Workspace locked</h2><p>Enter your PIN.</p><input id="pin" type="password" inputmode="numeric" maxlength="8"><button id="unlock" class="primary">Unlock</button><small id="pinMsg"></small></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
